<!DOCTYPE html>
<html lang="vi">
<head><meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="icon" type="image/jpeg" href="/assets/favicon.jpg?v=2">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang Phát Triển - 3HD2K Cinema</title>
    <link rel="stylesheet" href="/shared/css/main.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0c0c0c;
            color: #ffffff;
            font-family: var(--font-primary);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(229,9,20,0.12);
            border: 1px solid rgba(229,9,20,0.3);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #e50914;
            text-transform: uppercase;
            margin-bottom: 24px;
        }
        h1 {
            font-family: 'Inter', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 2px;
            margin-bottom: 16px;
            background: linear-gradient(180deg, #ffffff 30%, rgba(255,255,255,0.5) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.05rem;
            color: #888888;
            max-width: 480px;
            margin: 0 auto 36px;
            line-height: 1.7;
        }
        .gif-img {
            width: 100%;
            max-width: 420px;
            height: auto;
            border-radius: 16px;
            margin-bottom: 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            display: block;
        }
        .btn-home {
            background-color: #e50914;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-home:hover {
            background-color: #cc0812;
            transform: translateY(-2px);
        }
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            p { font-size: 0.95rem; }
            .gif-img { max-width: 100%; }
            .btn-home { width: 100%; max-width: 280px; box-sizing: border-box; justify-content: center; }
        }
        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge"><i class="fas fa-wrench"></i> Đang phát triển</div>
        <h1>SẮP RA MẮT</h1>
        <p>Tính năng này đang được chúng tôi hoàn thiện và sẽ sớm ra mắt trong thời gian tới. Mong bạn thông cảm và tiếp tục ủng hộ 3HD2K Cinema!</p>

        <img src="assets/denji-waiting.gif" class="gif-img" alt="Đang phát triển" onerror="this.style.display='none'">

        <a href="./explore/home-page/index.html" class="btn-home">
            <i class="fas fa-arrow-left"></i> Quay lại Trang chủ
        </a>
    </div>
</body>
</html>
