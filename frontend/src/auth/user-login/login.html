<!DOCTYPE html>
<html lang="vi">
<head><meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="icon" type="image/jpeg" href="/assets/favicon.jpg">
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="description" content="Đăng nhập vào tài khoản 3HD2K Cinema để đặt vé xem phim, nhận khuyến mãi và quản lý lịch sử giao dịch.">

    <meta property="og:title" content="Đăng Nhập - 3HD2K Cinema">
    <meta property="og:description" content="Đăng nhập để đặt vé xem phim và tận hưởng ưu đãi dành cho thành viên 3HD2K Cinema.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/assets/favicon.jpg">
    <title>Đăng nhập - 3HD2K Cinema</title>

    <link rel="stylesheet" href="../../shared/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../auth/auth-services/auth.css?v=4">
</head>
<body>

    <header class="auth-header">
        <a class="auth-logo" href="../../explore/home-page/index.html">3HD2K</a>
    </header>

    <main class="auth-main">

        <div class="auth-banner">
            <div class="auth-banner-bg">
                <img src="../../shared/images/cinema_audience_smiling.png" alt="Cinema Background">
            </div>
            <a href="../../explore/home-page/index.html" class="back-home-link">
                <span class="material-symbols-outlined">arrow_back</span>
                Về trang chủ
            </a>
            <h1 class="auth-banner-title">
                Trải Nghiệm Điện Ảnh <br><span>Đỉnh Cao</span>
            </h1>
        </div>

        <div class="auth-content">
            <div class="auth-box">

                <div class="auth-tabs">
                    <a href="../../auth/user-login/login.html" class="auth-tab active">Đăng Nhập</a>
                    <a href="../../auth/user-register/register.html" class="auth-tab">Đăng Ký</a>
                </div>

                <div id="form-error-banner" class="form-error-banner"></div>

                <form id="loginForm" class="auth-form" action="javascript:void(0);" novalidate>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined">person</span>
                            <input class="auth-input" type="email" id="email" name="email" placeholder="example@email.com" required>
                        </div>
                        <div id="email-error" class="inline-error">Email không hợp lệ.</div>
                    </div>

                    <div class="form-group">
                        <label for="password">Mật khẩu</label>
                        <div class="input-wrapper">
                            <span class="material-symbols-outlined">lock</span>
                            <input class="auth-input has-toggle" type="password" id="password" placeholder="••••••••" required>
                            <span class="material-symbols-outlined password-toggle" id="togglePassword" style="pointer-events: auto; z-index: 10;">visibility_off</span>
                        </div>
                        <div id="password-error" class="inline-error">Mật khẩu phải có ít nhất 6 ký tự.</div>
                    </div>

                    <div style="text-align: right; margin-bottom: 1.5rem; margin-top: -0.5rem;">
                        <a href="../../auth/forgot-password/index.html" style="font-size: 13px; color: var(--primary-red); text-decoration: none;">
                            Quên mật khẩu?
                        </a>
                    </div>

                    <button type="submit" class="btn-submit">
                        Đăng Nhập
                    </button>
                </form>

                <div id="otpSection" class="otp-section" style="display: none;">
                    <div class="otp-header">
                        <span class="material-symbols-outlined otp-icon">mark_email_read</span>
                        <h2 class="otp-title">Xác Nhận Email</h2>
                        <p class="otp-subtitle">Mã OTP 6 số đã được gửi đến</p>
                        <p class="otp-email" id="otpEmailDisplay"></p>
                    </div>

                    <div class="otp-inputs" id="otpInputs">
                        <input type="text" maxlength="1" class="otp-digit" data-index="0" inputmode="numeric" autocomplete="one-time-code">
                        <input type="text" maxlength="1" class="otp-digit" data-index="1" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-digit" data-index="2" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-digit" data-index="3" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-digit" data-index="4" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-digit" data-index="5" inputmode="numeric">
                    </div>

                    <div id="otpError" class="otp-error"></div>
                    <div id="otpSuccess" class="otp-success"></div>

                    <button type="button" class="btn-submit" id="verifyOtpBtn">
                        Xác Nhận
                    </button>

                    <div class="otp-footer">
                        <p class="otp-resend-text">
                            <button type="button" id="resendOtpBtn" class="otp-resend-btn" style="display:none;" disabled>
                                Gửi lại (<span id="resendCountdown">60</span>s)
                            </button>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="auth-footer">
        <span class="footer-logo">3HD2K</span>
        <div class="footer-copy">© 2026 3HD2K Cinema. All rights reserved.</div>
    </footer>

    <script type="module" src="../../auth/user-login/login.js?v=2"></script>
</body>
</html>
