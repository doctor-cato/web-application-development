<!doctype html>
<html lang="vi">
<head><meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="icon" type="image/jpeg" href="/assets/favicon.jpg?v=2">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3HD2K | Đặt vé - Đồ ăn</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/shared/css/main.css">
  <link rel="stylesheet" href="/booking/booking-food/styles.css">
</head>
<body>
<div id="navbar-placeholder"></div>

<main class="page">

  <form class="content">
    <section class="items">

      <div class="food-tabs" id="food-tabs">
        <a href="#section-combo" class="food-tab active" data-target="section-combo"><i class="fas fa-fire"></i> Combo Ưu Đãi</a>
        <a href="#section-food" class="food-tab" data-target="section-food"><i class="fas fa-hamburger"></i> Bắp & Nước</a>
      </div>

      <div id="section-combo" class="menu-section">
        <h2 class="section-title"><i class="fas fa-fire"></i> Combo Ưu Đãi <span>Khuyên dùng</span></h2>
        <section class="category">
        <button type="button" class="slider-btn prev"><i class="fas fa-chevron-left"></i></button>
        <div class="grid" id="grid-combo">
        </div>
        <button type="button" class="slider-btn next"><i class="fas fa-chevron-right"></i></button>
        </section>
      </div>

      <div id="section-food" class="menu-section">
        <h2 class="section-title"><i class="fas fa-hamburger"></i> Bắp & Nước <span>Giòn rụm, mát lạnh</span></h2>
        <section class="category">
        <button type="button" class="slider-btn prev"><i class="fas fa-chevron-left"></i></button>
        <div class="grid" id="grid-food">
        </div>
        <button type="button" class="slider-btn next"><i class="fas fa-chevron-right"></i></button>
        </section>
      </div>
    </section>

    <aside class="summary">
      <div class="summary-card">
        <h4>Tóm tắt đơn hàng</h4>
        <div class="movie"></div>
        <div class="lines">
          <div class="line line-ticket"><span class="muted"></span><span class="price"></span></div>
          <div class="summary-products"></div>
        </div>
        <div class="total">
          <span>Tổng tiền</span><strong class="amount"></strong>
        </div>
        <a class="btn primary" href="/booking/checkout/checkout.html">TIẾP TỤC THANH TOÁN</a>
        <a class="btn ghost" href="/booking/seat-booking/booking.html">Quay lại chọn ghế</a>
      </div>
    </aside>
  </form>
</main>

<div id="footer-placeholder"></div>
<script type="module" src="/shared/components/navbar.js"></script>
<script type="module" src="/shared/components/footer.js"></script>

<script src="/booking/booking-food/app.js"></script>
</body>
</html>
