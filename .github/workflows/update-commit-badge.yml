name: Auto Update Commit Badge

on:
  push:
    branches:
      - main
      - dev2

permissions:
  contents: write

jobs:
  update-badge:
    name: Update Commit Count Badge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Count Total Commits
        id: count
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "commit_count=$COUNT" >> $GITHUB_OUTPUT
          echo "Total commits: $COUNT"

      - name: Update Badge in README.md
        run: |
          COUNT=${{ steps.count.outputs.commit_count }}
          sed -i "s|img.shields.io/badge/Commits-[0-9]*-blue|img.shields.io/badge/Commits-${COUNT}-blue|g" README.md
          echo "README.md badge updated to $COUNT commits"

      - name: Update Badge in docs/index.md
        run: |
          COUNT=${{ steps.count.outputs.commit_count }}
          sed -i "s|img.shields.io/badge/Commits-[0-9]*-blue|img.shields.io/badge/Commits-${COUNT}-blue|g" docs/index.md
          echo "docs/index.md badge updated to $COUNT commits"

      - name: Check for Changes
        id: changes
        run: |
          if git diff --quiet README.md docs/index.md; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Badge Update
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md docs/index.md
          git commit -m "chore(badge): auto-update commit count badge to ${{ steps.count.outputs.commit_count }} [skip ci]"
          git push
